<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Nini · Prep from $89 · KM variant</title>
<style>
:root{--page:#FBF8F3;--ink:#1A1410;--body:#2F2A25;--muted:#5C554C;--gold:#F9C349;--gold-deep:#8A6410}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#ddd;color:var(--ink)}
.board{display:flex;flex-wrap:wrap;gap:1.5rem;padding:1.5rem;align-items:flex-start}
.frame{background:#111;padding:8px;border-radius:8px}
.label{font:700 11px/1.2 system-ui;color:#fff;margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
.feed,.story{background:var(--page);color:var(--ink);position:relative;overflow:hidden;
  font-family:"Georgia","Times New Roman",serif}
.feed{width:1080px;height:1080px;padding:72px;display:flex;flex-direction:column;justify-content:space-between}
.story{width:1080px;height:1920px;padding:96px 72px;display:flex;flex-direction:column;justify-content:space-between}
.brand{font:700 28px/1.2 system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink)}
.hl{font-size:92px;line-height:1.12;font-weight:600;max-width:14ch}
.hl em{font-style:italic;color:var(--gold-deep);font-weight:400}
.sub{font:400 36px/1.45 system-ui;color:var(--body);max-width:18ch;margin-top:24px}
.km{font:600 34px/1.7 system-ui;color:var(--gold-deep);margin-top:20px;max-width:20ch}
.cta{display:inline-block;background:var(--gold);color:var(--ink);font:700 32px/1 system-ui;
  padding:28px 40px;border-radius:12px}
.phone{font:700 40px/1.2 system-ui;margin-top:28px}
.rule{height:6px;width:96px;background:var(--gold);margin-top:32px}
.story .hl{font-size:110px}
.story .sub{font-size:40px}
.story .cta{font-size:36px;padding:32px 44px}
.spec{font:400 12px/1.4 system-ui;color:#ccc;margin-top:8px;max-width:1080px}
</style></head><body>
<div class="board">
  <div>
    <div class="label">Feed 1080×1080 · prep $89 · KM variant</div>
    <div class="frame"><div class="feed">
      <div>
        <div class="brand"><b>Nini Tax</b></div>
        <p class="hl">Tax prep <em>from $89.</em></p>
        <p class="km" lang="km">រៀបចំពន្ធចាប់ពី $89។</p>
        <p class="sub">EA · English &amp; Khmer</p>
      </div>
      <div>
        <span class="cta">Free first call</span>
      </div>
    </div></div>
  </div>
  <div>
    <div class="label">Story 1080×1920 · prep $89 · KM variant</div>
    <div class="frame"><div class="story">
      <div>
        <div class="brand">EA</div>
        <p class="hl">From $89.</p>
        <p class="km" lang="km">ខ្ញុំនិយាយខ្មែរ។</p>
      </div>
      <div>
        <span class="cta">(951) 889-7108</span>
      </div>
    </div></div>
  </div>
</div>
</body></html>
